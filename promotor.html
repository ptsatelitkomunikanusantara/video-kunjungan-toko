<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan Promotor — SKN/Unistar</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #1f2933; margin: 0; padding: 16px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 22px; }
    h1 { font-size: 20px; margin: 0 0 2px; color: #6d28d9; }
    .sub { font-size: 13px; color: #6b7280; margin: 0 0 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
    input[type=text], input[type=date], input[type=number], textarea { width: 100%; padding: 11px 12px; border: 1px solid #cbd2d9; border-radius: 9px; font-size: 15px; background: #fff; }
    textarea { min-height: 84px; resize: vertical; }
    input[type=file] { width: 100%; padding: 12px; border: 1.5px dashed #9aa5b1; border-radius: 9px; font-size: 14px; background: #fafbfc; }
    .hint { font-size: 12px; color: #9aa5b1; margin-top: 5px; }
    .btn { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 9px; background: #6d28d9; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:disabled { background: #9aa5b1; cursor: not-allowed; }
    .btn2 { width: 100%; padding: 11px; border: 1px solid #6d28d9; background: #f3e8ff; color: #6d28d9; border-radius: 8px; font-weight: 600; cursor: pointer; }
    #bar { height: 8px; background: #e4e7eb; border-radius: 5px; margin-top: 14px; overflow: hidden; display: none; }
    #barfill { height: 100%; width: 0%; background: #6d28d9; transition: width .2s; }
    #msg { margin-top: 16px; padding: 12px; border-radius: 9px; font-size: 14px; display: none; }
    #msg.ok { background: #e3f9e5; color: #0b6b2e; display: block; }
    #msg.err { background: #ffe3e3; color: #a61b1b; display: block; }
    .req { color: #d64545; }
    .peran { display: flex; gap: 10px; margin-bottom: 4px; }
    .prole { flex: 1; padding: 14px; border: 2px solid #cbd2d9; background: #fff; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; color: #51606e; }
    .prole.on { border-color: #6d28d9; background: #f3e8ff; color: #6d28d9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>📝 Laporan Kunjungan Toko</h1>
      <p class="sub">SKN / Unistar — isi saat kamu berada di toko</p>

      <label>Kamu siapa? <span class="req">*</span></label>
      <div class="peran">
        <button type="button" class="prole" id="btnProm" onclick="pilihPeran('Promotor')">👤 Promotor</button>
        <button type="button" class="prole" id="btnSales" onclick="pilihPeran('Sales')">🧑‍💼 Sales</button>
      </div>

      <form id="f" onsubmit="return false;" style="display:none;">
        <label>Tanggal <span class="req">*</span></label>
        <input type="date" id="tanggalKunjungan" required>
        <label>Nama <span class="req">*</span></label>
        <input type="text" id="namaPromotor" placeholder="cth: Sari" required>
        <label>Nama Toko <span class="req">*</span></label>
        <input type="text" id="namaToko" placeholder="cth: Toko Berkah Cell" required>

        <label>🎥 Video Toko</label>
        <input type="file" accept="video/*" id="vid">
        <label>📸 Foto Stok Toko</label>
        <input type="file" accept="image/*" multiple id="fot">
        <div class="hint" style="line-height:1.7;">🎥 <b>Video:</b> rekam <b>sekeliling isi toko</b> (layout &amp; kondisi).<br>📸 <b>Foto stok aktif</b> — <b>WAJIB banyak &amp; jelas</b>: Handphone, aksesoris, &amp; IoT.<br>ℹ️ <b>Dummy box tidak perlu difoto.</b></div>

        <label>📍 Titik Lokasi Toko <span class="req">*</span></label>
        <button type="button" id="btnGps" class="btn2" onclick="ambilLokasi()">📍 Ambil Lokasi Toko</button>
        <div id="gpsInfo" class="hint">Tekan saat kamu berada DI DEPAN toko, lalu izinkan akses lokasi.</div>

        <button type="button" class="btn" id="btn" onclick="kirim()">Kirim Laporan</button>
        <div id="bar"><div id="barfill"></div></div>
        <div id="msg"></div>
      </form>
    </div>
  </div>

  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxrxIizlkcaFwH1db6vZ-HBTNhojDHpy7lwDpuIli2aDAV-dWnRakgwBjXOnGTq--mOig/exec';
    var MAX = 500 * 1024 * 1024;
    var CHUNK = 5 * 1024 * 1024;
    var LOKASI = { lat: '', lng: '' };
    var PERAN = '';

    function pilihPeran(p) {
      PERAN = p;
      document.getElementById('btnProm').className = 'prole' + (p === 'Promotor' ? ' on' : '');
      document.getElementById('btnSales').className = 'prole' + (p === 'Sales' ? ' on' : '');
      document.getElementById('f').style.display = 'block';
    }

    async function callApi(action, params) {
      var body = Object.assign({ action: action }, params || {});
      var r = await fetch(APP_URL, { method: 'POST', body: JSON.stringify(body) });
      var j = await r.json();
      if (!j.ok) throw new Error(j.error || 'Gagal memproses');
      return j.result;
    }

    function sliceB64(file, start, end) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function (e) { resolve(e.target.result.split(',')[1]); };
        r.onerror = reject;
        r.readAsDataURL(file.slice(start, end));
      });
    }
    async function uploadOneFile(file, onProgress) {
      var sid = await callApi('mulaiUpload', { fileName: file.name, mimeType: file.type });
      var start = 0, fileId = null;
      while (start < file.size) {
        var end = Math.min(start + CHUNK, file.size);
        var b64 = await sliceB64(file, start, end);
        var isLast = end >= file.size;
        var res = await callApi('uploadChunk', { sid: sid, b64: b64, start: start, total: file.size, isLast: isLast });
        start = end;
        if (onProgress) onProgress(start);
        if (res && res.done) { fileId = res.fileId; break; }
      }
      if (!fileId) throw new Error('Upload "' + file.name + '" gagal.');
      return fileId;
    }

    function ambilLokasi() {
      var info = document.getElementById('gpsInfo'), b = document.getElementById('btnGps');
      if (!navigator.geolocation) { info.textContent = '⚠️ HP/browser ini tidak mendukung GPS.'; return; }
      b.disabled = true; info.textContent = '⏳ Mengambil lokasi...';
      navigator.geolocation.getCurrentPosition(function (pos) {
        LOKASI.lat = pos.coords.latitude.toFixed(6);
        LOKASI.lng = pos.coords.longitude.toFixed(6);
        info.innerHTML = '✅ Lokasi tersimpan: ' + LOKASI.lat + ', ' + LOKASI.lng;
        b.disabled = false; b.textContent = '📍 Ambil Ulang Lokasi';
      }, function (err) {
        info.textContent = '⚠️ Gagal ambil lokasi: ' + ((err && err.message) ? err.message : 'akses ditolak') + '. Aktifkan izin lokasi HP.';
        b.disabled = false;
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    }

    async function kirim() {
      var btn = document.getElementById('btn');
      if (!PERAN) return show('err', 'Pilih dulu: kamu Promotor atau Sales?');
      var form = {
        peran: PERAN, tanggalKunjungan: val('tanggalKunjungan'),
        nama: val('namaPromotor'), namaPromotor: val('namaPromotor'),
        namaToko: val('namaToko'),
        lat: LOKASI.lat, lng: LOKASI.lng
      };
      var video = document.getElementById('vid').files[0] || null;
      var fotos = Array.prototype.slice.call(document.getElementById('fot').files || []);
      if (!form.tanggalKunjungan || !form.namaPromotor || !form.namaToko) return show('err', 'Mohon lengkapi semua kolom bertanda *.');
      if (!video && !fotos.length) return show('err', 'Mohon upload minimal 1 foto atau video.');
      if (video && video.size > MAX) return show('err', 'Video ' + mb(video.size) + ' MB melebihi batas 500 MB.');
      if (!form.lat || !form.lng) { if (!confirm('Titik lokasi toko belum diambil. Tetap kirim tanpa lokasi?')) return; }

      var files = (video ? [video] : []).concat(fotos);
      var total = files.reduce(function (s, f) { return s + f.size; }, 0), done = 0;
      var bar = document.getElementById('bar'), fill = document.getElementById('barfill');
      btn.disabled = true; bar.style.display = 'block';
      show('ok', '⏳ Mengunggah ' + files.length + ' file... jangan tutup halaman.');
      try {
        var videoId = null, photoIds = [];
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          var fid = await uploadOneFile(f, function (sent) { fill.style.width = Math.round((done + sent) / total * 100) + '%'; });
          if (f === video) videoId = fid; else photoIds.push(fid);
          done += f.size; fill.style.width = Math.round(done / total * 100) + '%';
        }
        show('ok', '⏳ Menyimpan...');
        var res = await callApi('simpanKunjunganPromotor', { form: form, files: { videoId: videoId, photoIds: photoIds } });
        show('ok', '✅ Laporan terkirim! Terima kasih. (No. ' + res.id + ')');
        document.getElementById('f').reset();
        bar.style.display = 'none'; fill.style.width = '0%';
        LOKASI = { lat: '', lng: '' };
        document.getElementById('btnGps').textContent = '📍 Ambil Lokasi Toko';
        document.getElementById('gpsInfo').textContent = 'Tekan saat kamu berada DI DEPAN toko, lalu izinkan akses lokasi.';
      } catch (err) {
        show('err', '❌ ' + (err && err.message ? err.message : err));
      } finally {
        btn.disabled = false;
      }
    }

    function val(id) { return document.getElementById(id).value.trim(); }
    function show(cls, text) { var m = document.getElementById('msg'); m.className = cls; m.textContent = text; }
    function mb(b) { return (b / 1024 / 1024).toFixed(1); }
  </script>
</body>
</html>
